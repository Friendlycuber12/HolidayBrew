services:
  - type: web
    name: holidaybrew
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: API_TITLE
        value: Holiday Brew API
      - key: API_VERSION
        value: 1.0.0
      - key: ALLOWED_ORIGINS
        value: https://holidaybrew.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: holidaybrew-db
          property: connectionString

databases:
  - name: holidaybrew-db
    databaseName: holidaybrew
    user: holidaybrew
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
