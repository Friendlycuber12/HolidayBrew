name: Keep Render App Awake

on:
  schedule:
    # Runs every 13 minutes (Render sleeps after 15 min idle)
    - cron: "*/13 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          echo "Pinging HolidayBrew..."
          curl -sf --max-time 20 "${{ secrets.RENDER_APP_URL }}/health" \
            && echo "✅ App is awake" \
            || echo "⚠️ Ping failed (app may still be waking up)"